<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Fourniture BTP</title>
<!-- Build 2026-11-08-L4a -->
<style>:root {
  --bleu: #1f4e78; --bleu-clair: #e8eff6; --bleu-moyen: #2e6aa0;
  --texte: #1c2430; --texte-2: #5b6573; --fond: #f4f6f8; --carte: #ffffff;
  --bord: #d9dee5; --rouge: #b42318; --rouge-clair: #fdecea; --vert: #1e7b34; --vert-clair: #e7f5ea;
  --orange: #b54708; --orange-clair: #fff4e5; --rayon: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--fond); color: var(--texte);
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; line-height: 1.4; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 16px; margin: 18px 0 8px; }
p { margin: 6px 0; }
.aide { color: var(--texte-2); font-size: 13px; }
button { font: inherit; }

/* Cadre d'accueil */
.cadre-centre { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px; }
.logo { font-size: 26px; color: var(--bleu); letter-spacing: .3px; }
.sous-logo { color: var(--texte-2); font-size: 13px; margin-bottom: 20px; }
.boite { width: 100%; max-width: 420px; background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 18px; }
.boite h2 { margin-top: 0; }
.build { color: var(--texte-2); font-size: 11px; text-align: center; margin: 18px 0 8px; }

/* Application */
.appli { min-height: 100vh; padding-bottom: 72px; }
.entete { position: sticky; top: 0; z-index: 10; background: var(--bleu); color: #fff; display: flex;
  justify-content: space-between; align-items: center; padding: 10px 16px; }
.entete-titre { font-size: 17px; }
.entete-droite { display: flex; gap: 12px; align-items: center; font-size: 13px; min-width: 0; }
.entete-user { opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
.lien-entete { background: none; border: 1px solid rgba(255,255,255,.5); color: #fff; border-radius: 6px; padding: 4px 8px; }
.contenu { max-width: 900px; margin: 0 auto; padding: 14px 16px; }
.nav-bas { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; display: flex; background: #fff; border-top: 1px solid var(--bord); }
.nav-bas button { flex: 1; background: none; border: 0; padding: 8px 2px 10px; display: flex; flex-direction: column;
  align-items: center; gap: 2px; font-size: 11px; color: var(--texte-2); }
.nav-bas .ico { font-size: 18px; line-height: 1; }
.nav-bas button.actif { color: var(--bleu); font-weight: 600; }

.titre-page { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 12px; gap: 8px; }
.rangee-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }

/* Boutons */
.btn { border-radius: 8px; padding: 10px 14px; border: 1px solid transparent; cursor: pointer; font-weight: 500; min-height: 42px; }
.btn-petit { padding: 6px 10px; min-height: 34px; font-size: 13px; }
.btn-plein { width: 100%; }
.btn-primaire { background: var(--bleu); color: #fff; }
.btn-secondaire { background: var(--bleu-clair); color: var(--bleu); border-color: #c5d6e8; }
.btn-discret { background: transparent; color: var(--bleu); border-color: var(--bord); }
.btn-danger { background: var(--rouge); color: #fff; }
.btn:disabled { opacity: .55; cursor: default; }

/* Champs */
.champ { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; min-width: 0; }
.champ-label { font-size: 13px; color: var(--texte-2); font-weight: 500; }
.champ-aide { font-size: 12px; color: var(--texte-2); }
.champ input, .champ select, .champ textarea { font: inherit; font-size: 16px; padding: 9px 10px; border: 1px solid var(--bord);
  border-radius: 8px; background: #fff; color: var(--texte); width: 100%; }
.champ textarea { resize: vertical; }
.champ input:focus, .champ select:focus, .champ textarea:focus { outline: 2px solid #9cc0e3; border-color: var(--bleu-moyen); }
.case { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 14px; }
.case input { width: 20px; height: 20px; }
.grille2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 520px) { .grille2 { grid-template-columns: 1fr; } }
.filtres { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 4px 12px; margin-bottom: 10px; }

/* Messages */
.erreur { background: var(--rouge-clair); color: var(--rouge); border: 1px solid #f5c2bd; border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 14px; white-space: pre-wrap; }
.info { background: var(--bleu-clair); color: var(--texte); border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
.alerte { display: block; width: 100%; text-align: left; background: var(--orange-clair); color: var(--orange); border: 1px solid #f7d4a8;
  border-radius: 8px; padding: 12px; margin-bottom: 12px; font-weight: 600; }
.chargement { display: flex; align-items: center; gap: 10px; color: var(--texte-2); padding: 16px 0; }
.roue { width: 18px; height: 18px; border: 3px solid var(--bord); border-top-color: var(--bleu); border-radius: 50%; animation: tourne .8s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
#toast-zone { position: fixed; left: 12px; right: 12px; bottom: 84px; z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: #22303f; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 14px; max-width: 520px; transition: opacity .4s; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.toast-err { background: var(--rouge); }
.toast-out { opacity: 0; }

/* Listes et cartes */
.compteur { color: var(--texte-2); font-size: 13px; margin: 6px 0 8px; }
.liste { display: flex; flex-direction: column; gap: 8px; }
.carte { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 10px 12px; text-align: left; width: 100%; color: inherit; position: relative; }
button.carte { cursor: pointer; }
.carte.inactif { opacity: .6; }
.carte-clic { background: none; border: 0; padding: 0; text-align: left; width: 100%; color: inherit; cursor: pointer; }
.carte-haut { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.carte .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; color: var(--bleu); font-weight: 600; overflow-wrap: anywhere; }
.carte .unite { font-size: 12px; color: var(--texte-2); }
.carte .designation { margin: 4px 0 6px; font-weight: 500; }
.carte-bas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.carte .prix { margin-left: auto; font-weight: 600; }
.lien-wa { position: absolute; right: 12px; bottom: 10px; color: var(--vert); font-size: 13px; font-weight: 600; text-decoration: none; }
.badge { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: #eef0f3; color: var(--texte-2); white-space: nowrap; }
.badge-bleu { background: var(--bleu-clair); color: var(--bleu); }
.badge-vert { background: var(--vert-clair); color: var(--vert); }
.badge-rouge { background: var(--rouge-clair); color: var(--rouge); white-space: normal; }
.badge-orange { background: var(--orange-clair); color: var(--orange); }
.bloc { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 12px 14px; margin: 12px 0; }
.bloc h2 { margin-top: 2px; }
.bloc-danger { border-color: #f5c2bd; }
.formulaire { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 6px 14px 4px; }
.liste-simple { list-style: none; padding: 0; margin: 6px 0; }
.liste-simple li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eef0f3; }
.liste-bilan { padding-left: 18px; }
.aide-liste { margin: 0; padding-left: 18px; }
.aide-liste li { margin: 4px 0; }
.onglets { display: flex; gap: 6px; margin-bottom: 4px; }
.onglets button { flex: 1; padding: 9px; border: 1px solid var(--bord); background: #fff; border-radius: 8px; color: var(--texte-2); }
.onglets button.actif { background: var(--bleu); color: #fff; border-color: var(--bleu); }

/* Tableaux */
.tableau-defile { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px 0; border: 1px solid var(--bord); border-radius: 8px; }
.tableau { border-collapse: collapse; width: 100%; font-size: 13px; }
.tableau th { background: #f0f3f6; text-align: left; padding: 7px 8px; white-space: nowrap; position: sticky; top: 0; }
.tableau td { padding: 6px 8px; border-top: 1px solid #eef0f3; white-space: nowrap; vertical-align: top; }
.tableau td.col-des { white-space: normal; min-width: 220px; }
.tableau-simple td.num { text-align: right; font-variant-numeric: tabular-nums; }
.ligne-rejet td { background: #fffafa; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(3, 1fr); } }
.stat { background: #f4f6f8; border: 1px solid var(--bord); border-radius: 8px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; color: inherit; }
.stat b { font-size: 18px; }
.stat span { font-size: 11.5px; color: var(--texte-2); }
.stat.actif { border-color: var(--bleu); background: var(--bleu-clair); }
.stat-rouge b { color: var(--rouge); }
.stat-orange b { color: var(--orange); }
.ligne-proche td { background: #fffaf3; }
.tuiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tuile { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: inherit; }
.tuile b { font-size: 22px; color: var(--bleu); }
.tuile span { font-size: 12px; color: var(--texte-2); text-align: center; }
.ligne-param { border-bottom: 1px solid #eef0f3; padding-bottom: 4px; }

/* Lot 2 */
.carte.perimee { border-color: #f7d4a8; }
.offre-prix { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--texte-2); }
.offre-prix b { color: var(--texte); }
.rattache { font-size: 13px; margin: 6px 0 2px; color: var(--bleu); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.carte.ligne-probable { border-left: 4px solid #f0b75e; }
.carte.ligne-inconnu { border-left: 4px solid #e7867c; }
.carte.ligne-sur, .carte.ligne-manuel { border-left: 4px solid #7cc08c; }
.selecteur { border: 1px solid var(--bord); border-radius: 8px; padding: 4px 10px; margin: 8px 0; background: #fafbfc; }
.selecteur-liste { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.selecteur-item { text-align: left; background: #fff; border: 1px solid var(--bord); border-radius: 6px; padding: 8px; font-size: 13.5px; color: inherit; }
.selecteur-item .code { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--bleu); font-size: 12px; font-weight: 600; }
.ligne-voyage { border-bottom: 1px solid #eef0f3; padding: 6px 0; }
.interne { background: #fff8e6; border: 1px dashed #e5c07b; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 10px 0; }
.message { white-space: pre-wrap; font-family: inherit; font-size: 13px; background: #f4f6f8; padding: 8px; border-radius: 6px; margin: 6px 0; }
.entete-dossier { padding-bottom: 2px; }
.tableau td.num, .tableau th.num { text-align: right; font-variant-numeric: tabular-nums; }
.totaux { margin-top: 8px; }
.ligne-transport td { background: #f4f8fc; }
a.lien-btn { display: inline-flex; align-items: center; text-decoration: none; }
details summary { cursor: pointer; margin: 4px 0; }

/* Lots 2b, 3, 4 */
.pieces { margin-top: 8px; border-top: 1px solid #eef0f3; padding-top: 6px; }
.pieces-titre { font-weight: 600; font-size: 14px; }
.lien-fichier { background: none; border: 0; color: var(--bleu); text-decoration: underline; padding: 0; text-align: left; font-size: 14px; overflow-wrap: anywhere; }
.lien-wa-inline { display: inline-block; margin: 8px 0 2px; color: var(--vert); font-weight: 600; text-decoration: none; font-size: 14px; }
.alerte-bleue { background: var(--bleu-clair); color: var(--bleu); border-color: #c5d6e8; }
.alerte-douce { background: var(--orange-clair); color: var(--orange); border-radius: 6px; padding: 6px 8px; font-size: 13px; margin: 6px 0; }
.ajout-panier { display: flex; gap: 8px; align-items: flex-end; }
.ajout-panier .champ { flex: 1; margin-bottom: 0; }
.ajout-panier .btn { margin-bottom: 0; }
.ligne-devis { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #eef0f3; }
.ligne-devis input[type=checkbox] { width: 22px; height: 22px; margin-top: 2px; flex: none; }
.ligne-devis .case-vide { width: 22px; flex: none; }
.ligne-devis-corps { flex: 1; min-width: 0; font-size: 14px; }
.ligne-devis.inactif { opacity: .5; }
.choix-option { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.option-radio { border: 1px solid var(--bord); border-radius: 8px; padding: 10px; display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; background: #fff; }
.option-radio.actif { border-color: var(--bleu); background: var(--bleu-clair); }
.option-radio input { margin-top: 3px; }
label.btn { display: inline-flex; align-items: center; cursor: pointer; }
.nav-bas .ico { font-size: 17px; }

.entete-titre { white-space: nowrap; }
.entete-user { max-width: 34vw; }
</style>
</head>
<body>
<div id="racine"></div>
